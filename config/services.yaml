services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Application/'
            - '../src/Infrastructure/'

    # Domain layer - explicit binding for repositories, entities, value objects
    App\Domain\:
        resource: '../src/Domain/'
        autowire: false
        autoconfigure: false

    # Application layer - use cases, DTOs, interfaces
    App\Application\:
        resource: '../src/Application/'
        autowire: true
        autoconfigure: true

    # Infrastructure layer - implementations, adapters
    App\Infrastructure\:
        resource: '../src/Infrastructure/'
        autowire: true
        autoconfigure: true
        exclude: '../src/Infrastructure/Security/'

    # Security services
    App\Infrastructure\Security\:
        resource: '../src/Infrastructure/Security/'
        autowire: true
        autoconfigure: true

    # Controller namespace
    App\Controller\:
        resource: '../src/Controller/'
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']

    # Symfony Clock binding: resolves ClockInterface to the facade `Clock` class,
    # whose `now()`/`sleep()`/etc. all delegate to `Clock::get()` (the static
    # singleton). Tests advance time via `Clock::set(new MockClock(...))`; both
    # freshly-constructed entities (lazy `??=` fallback) and postLoaded entities
    # (injected by ClockInjectListener) see the **same** test instance.
    #
    # **Do NOT rebind to NativeClock/MockClock directly.** The dual-clock fix
    # depends on the facade falling through to Clock::get(). Concrete clocks
    # would silently bypass Clock::set() in test fixtures. ClockInjectListener
    # throws LogicException on container boot if this contract is broken.
    # See AssumptionLog.md 2026-07-31 (Clock refactor review follow-up, F3).
    Symfony\Component\Clock\ClockInterface:
        class: Symfony\Component\Clock\Clock

    # PhpDocExtractor joins the property_info type-extractor chain so nested
    # DTO arrays (e.g. CreateItemDTO::slots as ItemSlotDTO[]) are denormalized
    # from the @param docblock instead of staying raw arrays. Default priority
    # (-1001) places it before the constructor extractor (-1002).
    Symfony\Component\PropertyInfo\Extractor\PhpDocExtractor:
        tags:
            - { name: 'property_info.type_extractor', priority: -1001 }

    # Task 6.4: search wiring. MUST stay in this file, after the
    # App\Infrastructure\ resource block: the prototype redefines every class it
    # discovers, so arguments declared earlier (e.g. in config/packages/) are
    # silently dropped and the adapter would fall back to its production index
    # names — tests would then write to `items`/`collections`, killing the 6.3
    # isolation with no red test.
    #
    # `default:` falls back to the parameter when the env var is absent (dev and
    # prod .env do not set it); phpunit forces the *_test names. %env()% is
    # resolved at runtime, so building the container needs no engine.
    # Guarded by MeilisearchClientWiringTest::testAdapterUsesTheForcedTestIndexNames
    # — a clobbered definition reddens it.
    App\Application\Search\SearchIndexerInterface:
        alias: App\Infrastructure\Search\MeilisearchSearchAdapter

    # Task 6.6: the read side shares the same adapter (and its index names).
    # Separate interfaces because the contracts differ — writes fail open and
    # silent, reads must surface engine failures.
    App\Application\Search\SearchReaderInterface:
        alias: App\Infrastructure\Search\MeilisearchSearchAdapter

    App\Infrastructure\Search\MeilisearchSearchAdapter:
        arguments:
            $itemsIndex: '%env(default:search.items_index:MEILISEARCH_ITEMS_INDEX)%'
            $collectionsIndex: '%env(default:search.collections_index:MEILISEARCH_COLLECTIONS_INDEX)%'
            $circuitBreaker: '@App\Infrastructure\Search\WriteCircuitBreaker'

    # Task 6.7 (review-10): writes to a dead engine each cost the full transport
    # timeout, so after the first failure further writes are skipped for this
    # window. Reads are never guarded — they must surface engine errors.
    App\Infrastructure\Search\WriteCircuitBreaker:
        arguments:
            $ttlSeconds: '%env(default:search.circuit_ttl_seconds:SEARCH_CIRCUIT_TTL_SECONDS)%'

parameters:
    search.items_index: items
    search.collections_index: collections
    search.circuit_ttl_seconds: 30