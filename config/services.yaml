services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Application/'
            - '../src/Infrastructure/'

    # Domain layer - explicit binding for repositories, entities, value objects
    App\Domain\:
        resource: '../src/Domain/'
        autowire: false
        autoconfigure: false

    # Application layer - use cases, DTOs, interfaces
    App\Application\:
        resource: '../src/Application/'
        autowire: true
        autoconfigure: true

    # Infrastructure layer - implementations, adapters
    App\Infrastructure\:
        resource: '../src/Infrastructure/'
        autowire: true
        autoconfigure: true
        exclude: '../src/Infrastructure/Security/'

    # Security services
    App\Infrastructure\Security\:
        resource: '../src/Infrastructure/Security/'
        autowire: true
        autoconfigure: true

    # Controller namespace
    App\Controller\:
        resource: '../src/Controller/'
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']

    # Symfony Clock binding: resolves ClockInterface to the facade `Clock` class,
    # whose `now()`/`sleep()`/etc. all delegate to `Clock::get()` (the static
    # singleton). Tests advance time via `Clock::set(new MockClock(...))`; both
    # freshly-constructed entities (lazy `??=` fallback) and postLoaded entities
    # (injected by ClockInjectListener) see the **same** test instance.
    #
    # **Do NOT rebind to NativeClock/MockClock directly.** The dual-clock fix
    # depends on the facade falling through to Clock::get(). Concrete clocks
    # would silently bypass Clock::set() in test fixtures. ClockInjectListener
    # throws LogicException on container boot if this contract is broken.
    # See AssumptionLog.md 2026-07-31 (Clock refactor review follow-up, F3).
    Symfony\Component\Clock\ClockInterface:
        class: Symfony\Component\Clock\Clock

    # PhpDocExtractor joins the property_info type-extractor chain so nested
    # DTO arrays (e.g. CreateItemDTO::slots as ItemSlotDTO[]) are denormalized
    # from the @param docblock instead of staying raw arrays. Default priority
    # (-1001) places it before the constructor extractor (-1002).
    Symfony\Component\PropertyInfo\Extractor\PhpDocExtractor:
        tags:
            - { name: 'property_info.type_extractor', priority: -1001 }