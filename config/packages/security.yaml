security:
    # fwd-15: stated explicitly instead of relying on the bundle default
    # (affirmative, AccessDecisionManager:49). Under affirmative a second
    # voter granting access would silently override SocialContentVoter's DENY
    # for editing a like. Unanimous also lets a future voter abstain freely:
    # abstain is transparent under unanimous (only an explicit DENY blocks), so
    # a voter for another domain may abstain on SOCIAL_* attributes without
    # accidentally locking down the access_control routes.
    #
    # Scope: this strategy governs every decision made through the access
    # decision manager, which is wider than social moderation — `access_control`
    # rows (AccessListener:78) and #[IsGranted] (LogoutController:17) pass
    # through it too. It does NOT govern the owner-or-admin checks, which run
    # outside the ADM as User::isOwnerOrAdminOf() via canManage/denyUnlessCanManage
    # (and inline in CollectionController::update) — see ARCHITECTURE.md,
    # "Authorization".
    access_decision_manager:
        strategy: unanimous
        # allow_if_all_abstain stays at its default (false): all voters abstained
        # is answered with denied. Relaxing it would hand anonymous access to
        # any attribute nobody votes on.

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Domain\User\Entity\User:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            provider: app_user_provider

    access_control:
        # Public endpoints (anonymous access)
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc.json, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Anonymous GET access to collections and search per PRD (firewall level).
        # A controller still answers 401 on its own when it needs an identity
        # rather than a resource — the "own" listings (items, likes, comments,
        # tags). `liked_by_me` is NOT such a case: a guest reads the item detail
        # and gets liked_by_me=false.
        #
        # Guest reads (fwd-7, PRD story 37). `access_control` matches the FIRST row whose
        # path matches, and PathRequestMatcher anchors only the LEFT edge — the
        # pattern has no trailing `$` of its own, which is why every row below
        # that must bound a single segment carries an explicit `$`. Without it,
        # `^/api/items/[^/]+` would also swallow a future `GET /api/items/{id}/X`
        # and make it public without anyone deciding so.
        # The rows are anchored rather than sharing one namespace row: a new
        # sub-resource of an item then requires an explicit row to become public,
        # instead of inheriting access from the item endpoint.
        # HEAD is listed with GET because the router serves HEAD from the GET
        # route while MethodRequestMatcher compares the raw method with no
        # HEAD->GET folding — without it a HEAD probe gets 401 on a public read.
        # Everything else under /api/items — own listings, every mutation — falls
        # through to the catch-all at the bottom.
        - { path: '^/api/items/[^/]+$', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: '^/api/items/[^/]+/likes$', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: '^/api/items/[^/]+/comments$', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        # Split into GET and the rest: a guest may read the items of a collection
        # but not create them. First match wins, so GET/HEAD stop at the first row
        # and every other method falls through to the authenticated one.
        # No `$` here, unlike the /api/items rows above: this path has no
        # sub-resources today, and adding one later means reviewing this row then,
        # which is the moment to decide. The row below catches every non-GET.
        - { path: '^/api/collections/[^/]+/items', roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: '^/api/collections/[^/]+/items', roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/collections, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api/search, roles: PUBLIC_ACCESS, methods: [GET] }
        # Authenticated endpoints
        - { path: ^/api/logout, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Domain\User\Entity\User:
                algorithm: bcrypt
                cost: 4