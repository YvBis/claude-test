security:
    # fwd-15: stated explicitly instead of relying on the bundle default
    # (affirmative, AccessDecisionManager:49). Under affirmative a second
    # voter granting access would silently override SocialContentVoter's DENY
    # for editing a like. Unanimous also lets a future voter abstain freely:
    # abstain is transparent under unanimous (only an explicit DENY blocks), so
    # a voter for another domain may abstain on SOCIAL_* attributes without
    # accidentally locking down the access_control routes.
    #
    # Scope: this strategy governs every decision made through the access
    # decision manager, which is wider than social moderation — `access_control`
    # rows (AccessListener:78) and #[IsGranted] (LogoutController:17) pass
    # through it too. It does NOT govern the inline owner-or-admin checks in
    # AbstractApiController::canManage and CollectionController::delete, which
    # never reach the ADM (see ARCHITECTURE.md, "Authorization").
    access_decision_manager:
        strategy: unanimous
        # allow_if_all_abstain stays at its default (false): all voters abstained
        # is answered with denied. Relaxing it would hand anonymous access to
        # any attribute nobody votes on.

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Domain\User\Entity\User:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            provider: app_user_provider

    access_control:
        # Public endpoints (anonymous access)
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc.json, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Anonymous GET access to collections and search per PRD (firewall level):
        # PUBLIC_ACCESS lets the request through, but controllers that require a user
        # answer 401 — full guest views are Roadmap task fwd-7.
        # Item reads are owner/admin only (Task 4.5): the collection-items
        # rule must come BEFORE the public collections rule (first match wins).
        - { path: '^/api/collections/[^/]+/items', roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/collections, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/search, roles: PUBLIC_ACCESS, methods: [GET] }
        # Authenticated endpoints
        - { path: ^/api/logout, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Domain\User\Entity\User:
                algorithm: bcrypt
                cost: 4