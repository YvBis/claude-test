services:
    # The Meilisearch client requires a PSR-18 client and PSR-17 factories.
    # They are wired explicitly rather than discovered: with null arguments the
    # constructor runs discovery, which can throw while *building* the service
    # when it cannot resolve the installed combination — that would break the
    # container rather than the first search.
    Nyholm\Psr7\Factory\Psr17Factory: ~

    # Task 6.4 put the engine in the request path of every item mutation, so a
    # dead engine must fail fast. Measured: against an unreachable host,
    # indexItem() held the request 21.4 s with the default client and 2.0 s
    # with timeout: 2. `timeout` is the idle/connect budget; max_duration caps a
    # slow-but-alive engine. Writes only enqueue a task, so 2 s is generous;
    # provisioning polls with many short requests, each within the budget.
    meilisearch.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { timeout: 2, max_duration: 10 }

    # Files in config/packages do NOT inherit _defaults from services.yaml, so
    # without an explicit $responseFactory this service is not autowired and
    # its constructor picks the PSR-17 factories itself. Its fallback chain
    # happens to work today (nyholm/psr7 is a direct requirement), but relying
    # on the order of that chain is not a contract.
    Symfony\Component\HttpClient\Psr18Client:
        arguments:
            $client: '@meilisearch.http_client'
            $responseFactory: '@Nyholm\Psr7\Factory\Psr17Factory'

    Meilisearch\Client:
        arguments:
            $url: '%env(MEILISEARCH_URL)%'
            $apiKey: '%env(MEILISEARCH_KEY)%'
            $httpClient: '@Symfony\Component\HttpClient\Psr18Client'
            $requestFactory: '@Nyholm\Psr7\Factory\Psr17Factory'
            $streamFactory: '@Nyholm\Psr7\Factory\Psr17Factory'

# Since 6.4 the adapter injects this client, so it is a real consumer and is
# no longer pruned; tests fetch it from the test container's private-service
# locator (`self::getContainer()->get(Client::class)`). The 6.1–6.3 public
# `test.meilisearch_client` alias existed only to bridge the gap before that
# and is removed. Do not reintroduce it by redefining the same id in when@test:
# that REPLACES the definition and drops the constructor arguments.