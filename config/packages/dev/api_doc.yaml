nelmio_api_doc:
    documentation:
        info:
            title: 'TaskFlow API'
            version: '1.0.0'
            description: 'REST API for managing personal collections'
        security:
            - Bearer: []
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Item:
                    type: object
                    required: [id, name, collection_id, slots, tags, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: '1984' }
                        collection_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        slots:
                            type: array
                            description: 'Filled slots only'
                            items:
                                type: object
                                required: [type, slot, value]
                                properties:
                                    type: { type: string, enum: [text, number, date, bool] }
                                    slot: { type: integer, minimum: 1, maximum: 3 }
                                    value: { type: string }
                        tags:
                            type: array
                            items:
                                type: object
                                required: [id, name]
                                properties:
                                    id: { type: string, format: uuid }
                                    name: { type: string }
                        created_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                        updated_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
        servers:
            - url: 'http://localhost:8000'
              description: 'Development server'
    areas:
        default:
            path_patterns:
                - '^/health'
                - '^/api/'
            host_patterns: []
    models:
        use_jms: false