nelmio_api_doc:
    documentation:
        info:
            title: 'TaskFlow API'
            version: '1.0.0'
            description: 'REST API for managing personal collections'
        security:
            - Bearer: []
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                User:
                    type: object
                    required: [id, name, email, role, is_active, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: 'Ada Admin' }
                        email: { type: string, format: email, example: 'ada@example.com' }
                        role: { type: string, enum: [user, admin], example: 'admin' }
                        is_active: { type: boolean, example: true }
                        created_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                        updated_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                Item:
                    type: object
                    required: [id, name, collection_id, slots, tags, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: '1984' }
                        collection_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        slots:
                            type: array
                            description: 'Filled slots only'
                            items:
                                type: object
                                required: [type, slot, value]
                                properties:
                                    type: { type: string, enum: [text, number, date, bool] }
                                    slot: { type: integer, minimum: 1, maximum: 3 }
                                    value: { type: string }
                        tags:
                            type: array
                            items:
                                type: object
                                required: [id, name]
                                properties:
                                    id: { type: string, format: uuid }
                                    name: { type: string }
                        created_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                        updated_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                Tag:
                    type: object
                    required: [id, name]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: 'Books' }
                ItemSearchHit:
                    type: object
                    description: 'Engine document as-is: no slots, no timestamps (6.6)'
                    required: [id, name, tags, collection_id, collection_name, owner_id]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: 'Dune' }
                        tags: { type: array, items: { type: string }, example: ['sci-fi'] }
                        collection_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        collection_name: { type: string, example: 'Books' }
                        owner_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                CollectionSearchHit:
                    type: object
                    description: 'Engine document as-is (6.6)'
                    required: [id, name, theme, description, owner_id]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        name: { type: string, example: 'My Books' }
                        theme: { type: string, enum: [books, games, movies, drinks], example: 'books' }
                        description: { type: string, example: 'Everything to read' }
                        owner_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                ItemDetail:
                    allOf:
                        - $ref: '#/components/schemas/Item'
                        - type: object
                          required: [likes_count, comments_count, liked_by_me]
                          properties:
                              likes_count: { type: integer, example: 3 }
                              comments_count: { type: integer, example: 2 }
                              liked_by_me: { type: boolean, example: false }
                Like:
                    type: object
                    required: [id, owner_id, owner_name, item_id, created_at]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        owner_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        # fwd-5: resolved by a batch user lookup instead of read off
                        # the entity, so "absent" is representable in code for the
                        # first time. The users(id) foreign key means it is always
                        # present in practice, hence nullable rather than optional:
                        # the key stays required, only its value may be null.
                        owner_name: { type: string, nullable: true, example: 'John Doe' }
                        item_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        created_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                Comment:
                    type: object
                    required: [id, owner_id, owner_name, item_id, content, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        owner_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        owner_name: { type: string, nullable: true, example: 'John Doe' }
                        item_id: { type: string, format: uuid, example: '018f0a1b-2c3d-4e5f-6789-0123456789ab' }
                        content: { type: string, maxLength: 3000, example: 'Great read! ## Notes' }
                        created_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                        updated_at: { type: string, format: date-time, example: '2026-07-17T12:00:00Z' }
                # fwd-23: the single envelope for every 4xx/5xx produced by
                # AbstractApiController helpers and ApiExceptionSubscriber.
                # `error` is always the HTTP reason phrase (5A contract);
                # `message`/`details` are optional (500 carries bare {error}).
                Error:
                    type: object
                    required: [error]
                    description: 'Canonical API error envelope'
                    properties:
                        error: { type: string, example: 'Unprocessable Entity' }
                        message: { type: string, example: 'Validation failed' }
                        details:
                            type: array
                            items: { type: string }
                            example: ['Collection name must be at least 3 characters']
        servers:
            - url: 'http://localhost:8000'
              description: 'Development server'
    areas:
        default:
            path_patterns:
                - '^/health'
                - '^/api/'
            host_patterns: []
    models:
        use_jms: false