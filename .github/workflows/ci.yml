name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_CACHE_DIR: ~/.composer/cache
  COVERAGE_MIN: 80

jobs:
  static-analysis:
    name: Static Analysis & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: taskflow_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=60s
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci
        with:
          extensions: pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, redis, xdebug

      - name: Cache PHPStan
        uses: actions/cache@v4
        with:
          path: var/cache/phpstan
          key: phpstan-${{ hashFiles('phpstan.neon', 'composer.lock') }}
          restore-keys: |
            phpstan-

      - name: Cache PHP-CS-Fixer
        uses: actions/cache@v4
        with:
          path: var/cache/.php-cs-fixer.cache
          key: phpcsfixer-${{ hashFiles('.php-cs-fixer.dist.php', 'composer.lock') }}
          restore-keys: |
            phpcsfixer-

      - name: Run static analysis (PHPStan, PHPCSFixer check, Rector dry-run)
        run: composer ci:static:quality

  symfony-diagnostics:
    name: Symfony Diagnostics (symfony-lsp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking gate (Roadmap 5.14): the checker fails the job on blocking
    # diagnostics and on an incomplete report. The verdict is re-derived from
    # a single `--format=json` artifact by scripts/symfony-lsp-gate.php — never
    # from the checker's exit code alone, and never from two runs.
    env:
      SYMFONY_LSP_VERSION: '0.23.0'
      # Binary and checker index share one cached directory, so a cache hit skips
      # the release download (the archive is still checksum-verified before use).
      SYMFONY_LSP_BIN_DIR: var/symfony-lsp/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci

      - name: Cache symfony-lsp index and binary
        uses: actions/cache@v4
        with:
          path: var/symfony-lsp
          # The key covers both the checker index (which depends on the
          # application's dependencies) and the cached release archive.
          # restore-keys still reuses the archive when only the config hash
          # changes, so a composer.lock bump re-analyses the index without
          # re-downloading the release.
          key: symfony-lsp-${{ runner.os }}-${{ env.SYMFONY_LSP_VERSION }}-${{ hashFiles('.symfony-lsp.json', 'composer.lock') }}
          restore-keys: |
            symfony-lsp-${{ runner.os }}-${{ env.SYMFONY_LSP_VERSION }}-

      # --environment=test is required: the checker defaults to "dev" and ignores
      # .env, and the dev cache adapter is Redis, which would need a service on
      # the runner. The test environment (what the copied .env.test selects)
      # boots without a database, cache backend or message transport.
      #
      # A second --source-only pass was dropped in task 5.17. The parity probe
      # (PRD/5.17-parity-probe.md) injected six boot-safe defects across route,
      # template, service, parameter and bundle-config classes: the runtime pass
      # reported four of them, while --source-only reported none at all (a
      # healthy run - complete: true, analysis.mode: source-only) on both a warm
      # and a deleted index. Every diagnostic code the checker offers resolves
      # references against the runtime index, so on this project and fixture,
      # with symfony-lsp 0.21.x, the runtime pass was the only one that reported
      # anything; re-confirmed on 0.23.x by the 5.26 re-probe (PRD/5.26-symfony-lsp-version-bump.md).
      # Two of the six
      # defects were missed by both modes - the probe was re-run on the 0.23.0
      # bump (task 5.26) with the same result; a future checker bump needs a new
      # probe task.
      # 5.14 risk: 0.23.0 emits an empty diagnostic list while the runtime index
      # is incomplete - an incomplete index yields a green result instead of
      # stale findings. The gate below closes it: scripts/symfony-lsp-gate.php
      # fails the job unless the report proves `complete: true`,
      # `runtime.state: ready` and `blocking: 0` (measured shapes in
      # PRD/5.14-blocking-diagnostics.md). Gating on `blocking` alone would be
      # green exactly when blind.
      - name: Run Symfony Language Tools checker (runtime analysis)
        # `|| true` is intentional: the checker exits non-zero on blocking
        # diagnostics (10) and on failed sections (12), but its exit code is
        # not the verdict — the gate script below re-derives everything from
        # the JSON artifact and is the sole source of pass/fail.
        run: |
          bash scripts/symfony-lsp-check.sh --environment=test --format=json > var/symfony-lsp-report.json || true
          php scripts/symfony-lsp-gate.php var/symfony-lsp-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: taskflow_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=60s
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
      # Task 6.3: the search tests run against a real engine. Same minor tag as
      # docker-compose.yml (ADR pin policy); the master key is hardcoded like
      # the mysql credentials above — there is no production yet, and a secret
      # would break fork PRs without adding security.
      meilisearch:
        image: getmeili/meilisearch:v1.54
        env:
          MEILI_MASTER_KEY: masterKey123
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: --health-cmd="wget -qO- http://127.0.0.1:7700/health | grep -q available" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci

      - name: Cache PHPStan
        uses: actions/cache@v4
        with:
          path: var/cache/phpstan
          key: phpstan-${{ hashFiles('phpstan.neon', 'composer.lock') }}
          restore-keys: |
            phpstan-

      - name: Cache PHP-CS-Fixer
        uses: actions/cache@v4
        with:
          path: var/cache/.php-cs-fixer.cache
          key: phpcsfixer-${{ hashFiles('.php-cs-fixer.dist.php', 'composer.lock') }}
          restore-keys: |
            phpcsfixer-

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/taskflow_test?serverVersion=8.0

      - name: Run migrations
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/taskflow_test?serverVersion=8.0

      # One PHPUnit run does both jobs. The suite costs about the same with and
      # without coverage collection (measured on the runner: 272 s under
      # XDEBUG_MODE=coverage, 269 s under --no-coverage), so the second pass
      # bought no signal for another 4.5 minutes of the job budget. Task 5.30
      # merged the two steps and moved --display-deprecations into the `phpunit`
      # composer script this step runs.
      #
      # Deprecations are enforced, not just surfaced. The bridge env var is useless
      # here: it was removed from phpunit.xml.dist in fwd-29, and
      # symfony/phpunit-bridge never registers its handler on PHPUnit >= 10 (its
      # bootstrap returns as soon as PHPUnit\Metadata\Metadata exists), so
      # a `weak` run would silently prove nothing. PHPUnit reports
      # E_USER_DEPRECATED natively - proven with a transient trigger_error probe:
      # --display-deprecations prints test + line, and since 5.25 PR-1
      # failOnDeprecation="true" in phpunit.xml.dist fails the run.
      #
      # pipefail keeps PHPUnit's exit code authoritative through the tee, and the
      # status is captured so the summary is still written when the gate fails:
      # a real test failure must fail the job, because this step is the gate.
      # The deprecation line is blocking too. Note: @trigger_error() suppresses the
      # notice, so PHPUnit cannot see deprecations raised that way - do not use
      # the suppression operator.
      - name: Run PHPUnit with coverage enforcement and deprecation reporting
        run: |
          set -o pipefail
          mkdir -p var
          status=0
          composer coverage:gate 2>&1 | tee var/phpunit-ci.log || status=$?
          if grep -qE 'triggered [0-9]+ deprecation' var/phpunit-ci.log; then
            echo "::warning::PHPUnit reported deprecations - see the job log. Since 5.25 PR-1 the run already fails on them (failOnDeprecation); this warning only marks the log."
          fi
          cat var/phpunit-ci.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/taskflow_test?serverVersion=8.0
          XDEBUG_MODE: coverage
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}

      # Task 5.31: the deprecation warning above greps for PHPUnit's own
      # output line, so a PHPUnit upgrade that rewords it would blind the
      # warning while the pipeline stays green. The probe replays both
      # fixtures against the pattern extracted from that grep and fails the
      # job loudly on drift. Blocking on purpose: a blind warning is worse
      # than a red pipeline. Runs as its own step (not inside the suite):
      # one child PHPUnit boot costs ~6 s, two of them inside every local
      # run was over budget.
      - name: Probe deprecation output format
        run: bash scripts/deprecation-format-probe.sh

  # Task 8.1: end-to-end journeys over the *composed* stack (nginx -> php-fpm ->
  # MySQL/Meilisearch). The in-kernel WebTestCase functional tests never cross
  # nginx/php-fpm, so this is the layer they cannot cover (Redis is part of the
  # stack but no journey exercises it: no cache.app consumer in src, messenger is
  # in-memory under test). A Bruno collection (plain-text .bru under tests/E2E)
  # drives it; the tool choice and the collection contract live in
  # PRD/8.1-e2e-bruno.md and ADR/0002-e2e-client.md.
  e2e:
    name: E2E (Bruno)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # composer install must run before `docker compose up`: the app image
      # bind-mounts the workspace and the Dockerfile carries no COPY of the code,
      # so vendor/ and JWT keys come from this step.
      - name: Setup CI environment
        uses: ./.github/actions/setup-ci

      # setup-ci generates the keypair with `openssl genrsa`, which writes 0600,
      # owned by the runner user. The composed stack reads the private key as
      # www-data (uid 1000), which is not the owner on the runner, so JWT signing
      # fails with a 500 on every authenticated-token path — login only; register
      # never touches the key. The host-PHP jobs are unaffected because they run
      # as the owner (measured locally: a root-owned 0600 key is DENIED to
      # www-data, 0644 is readable).
      - name: Make JWT keys readable by the container user
        run: chmod 644 config/jwt/private.pem config/jwt/public.pem

      # .env.test omits MEILISEARCH_URL/KEY on purpose (that file serves two
      # network namespaces), but the compose app container must reach the engine
      # by its service name. Append the compose-only values to the .env that
      # docker-compose.yml consumes via env_file. The leading blank line matters:
      # .env.test carries no trailing newline, so a naive append glues the first
      # key onto the last line ("###< lexik... ###MEILISEARCH_URL=..."), which
      # Symfony reads as a comment and the variable goes missing at runtime.
      - name: Point the composed stack at its services
        run: printf '\nMEILISEARCH_URL=http://meilisearch:7700\nMEILISEARCH_KEY=masterKey123\n' >> .env

      - name: Start the stack
        run: docker compose up -d --build

      # docker-compose.yml mounts an anonymous volume at /var/www/html/var
      # (line 11), which on a fresh runner is created root-owned; php-fpm runs
      # as www-data and cannot write var/cache, so the first request dies with
      # "Unable to write in the cache directory". Locally this volume already
      # exists chowned, which is why the omission is invisible until a clean
      # machine. Do it before the first HTTP request.
      - name: Make the app var/ writable
        run: docker compose exec -T -u root app sh -c 'mkdir -p var/cache var/log && chown -R www-data:www-data var'

      - name: Wait for the app to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy" >&2
          docker compose logs --no-color | tail -100
          exit 1

      # /health only proves the app answered; it does not touch the database. The
      # db healthcheck (docker-compose.yml) is TCP-based, so waiting on the
      # container's own health status is a truthful single source of truth — no
      # credentials re-keyed here, no container name hardcoded. On main after the
      # 8.1 merge (task 8.7), migrations raced MySQL startup and died with
      # "SQLSTATE[HY000] [2002] Connection refused".
      #
      # Deliberately redundant: `app.depends_on.db.condition: service_healthy`
      # already makes `docker compose up -d` block until the db is healthy, so
      # this loop normally exits on its first iteration. It stays as an explicit,
      # cheap assertion that survives a future regression of that depends_on, and
      # documents the dependency where it matters.
      - name: Wait for the database to be healthy
        run: |
          for _ in $(seq 1 60); do
            id=$(docker compose ps -q db)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then
              echo "database is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "database did not become healthy (last status: $status)" >&2
          docker compose logs --no-color db | tail -50
          exit 1

      - name: Run migrations on the composed database
        run: docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned like every other tool in this repo (symfony-lsp, meilisearch):
      # `.bru` parsing and CLI flags are version-sensitive, and this is a blocking
      # gate now — an unannounced upstream release must not be able to break it
      # without a change in this repository. Bump deliberately.
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@4.2.1

      # bru resolves the collection from the working directory ("You can run
      # only at the root of a collection"), so the step runs inside tests/E2E.
      - name: Run E2E journeys
        working-directory: tests/E2E
        run: bru run --env ci

      - name: Tear down
        if: always()
        run: docker compose down -v

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --no-scripts

      - name: Run composer audit
        run: composer audit --locked

  # Aggregates the blocking jobs: symfony-diagnostics has been a blocking gate
  # since task 5.14 (before that it was the non-blocking pilot, deliberately
  # left out of needs). The single edit
  # point is `needs:` below — the step derives the table from `${{ toJSON(needs) }}`,
  # so a new job lands in the gate automatically once added to `needs:`
  # (the old two-place STATUS-string + grep hazard is gone, task 5.27).
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, dependency-audit, symfony-diagnostics, e2e]
    if: always()
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Determine overall status
        run: |
          # jq failure must fail the job loudly: an unchecked process
          # substitution would iterate zero times and report a false green,
          # exactly the silent-hole class this step aggregates against (5.27).
          # The same holds for an empty table (e.g. an emptied needs: list).
          table=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS_JSON") || exit 1
          [ -n "$table" ] || exit 1
          failed=0
          while read -r job result; do
            echo "$job: $result"
            [ "$result" = "success" ] || failed=1
          done <<<"$table"
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
