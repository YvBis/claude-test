name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Review only the newest head of a pull request. A newer push cancelling the
# in-flight run is intentional: a queued run keeps the commit it was triggered
# with (on pull_request events github.sha is the synthetic merge commit of that
# moment), so it would report on outdated code, and every run spends the
# OpenRouter free pool, which is capped at 50 requests/day. A cancelled run
# therefore means "no verdict yet"; a verdict is lost only when the job times out
# or the LLM fails, which is what the timeouts below are sized for.
concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenRabbit Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    # Worst path: 12 + 15 + 2 + 3 = 32, leaving ~2.5 min for checkout and
    # runner start (task 5.29).
    #
    # Observed numbers live in one place only — PRD/5.20-review-timing-measurement.md
    # (canonical snapshot, task 5.20) — because run timings go stale on re-measure
    # and five copies drift. Re-measure any time with:
    # bash scripts/review-timing-report.sh <run-id>.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run AI Code Review (OpenRouter free)
        id: openrouter
        # 12 + 15 minutes, leaving three of the 35-minute job budget for checkout
        # and overhead: a hung primary fails its step early so the fallback keeps
        # a full window, and a hang can no longer eat the whole budget.
        timeout-minutes: 12
        continue-on-error: true
        uses: aryanbrite/openrabbit@v0.8.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_provider: openrouter
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced

      # A green primary step does not mean a verdict exists: the action can exit 0
      # having published nothing (observed on PR #84, and on three consecutive runs
      # of PR #87 against one run that did publish a real verdict). This step asks
      # the only question that matters - is there a verdict for this head? - and
      # the fallback below is keyed on its answer rather than on the exit code.
      #
      # It runs with `always()`, not `steps.openrouter.outcome == 'success'`.
      # That condition was measured to skip the probe even when the primary had
      # SUCCEEDED and published a real verdict (PR #132, two consecutive runs):
      # the primary went green in 8 minutes, the probe was skipped with zero
      # duration, and the fallback condition below - which is fail-open on an
      # unwritten output - then fired the second provider for no reason, where it
      # hung for 15 minutes and failed the required check. The workflow's own
      # comment claimed the probe is skipped only on a primary failure, and the
      # whole fallback design rests on that claim being true.
      #
      # Skipping a detector on a condition has been disproven here; asking the
      # question unconditionally is what makes the answer dependable. On a failed
      # primary the API call costs one bounded round trip instead of nothing, which
      # is cheap next to the 15-minute provider call it saves.
      - name: Check whether the primary provider published a verdict
        id: primary_verdict
        if: always()
        # This step calls the GitHub API with retries, so it gets its own bound
        # (task 5.29): a hung API call must fail the step instead of eating the
        # job budget.
        timeout-minutes: 2
        # Tolerated like the primary: the step bound kills bash before the
        # script's EXIT trap runs, so without this a hung probe would fail the
        # required check even after the fallback publishes a verdict - defeating
        # the rescue. The probe is observability for the fallback condition, not
        # a verdict gate; a failed probe leaves the output empty, which the
        # fallback condition already treats as "run".
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 3x5s: the reviews list is eventually consistent right after the action
          # publishes, but this probe sits between two provider calls, so its wait
          # is part of the job budget asserted in CodeReviewConfigTest.
          VERDICT_ATTEMPTS: '3'
          VERDICT_DELAY: '5'
        run: |
          bash scripts/verify-review-verdict.sh --probe \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.repository }}"

      # OpenRabbit has no native NVIDIA provider: its Groq client speaks the same
      # OpenAI-compatible protocol, so "llm_provider: groq" is the transport for
      # the NVIDIA NIM endpoint and model below.
      #
      # The condition is a fail-open test, not a failure test: it runs the fallback
      # whenever a verdict is not *known* to exist - `missing`, `unverified` (the
      # API was unreadable), or an output that never got written. That costs one
      # NVIDIA NIM call on most pull requests, which is the accepted price for not
      # losing the verdict; the OpenRouter free pool is not spent on a retry.
      #
      # `missing` and `unverified` are treated alike here on purpose: both mean
      # "run the fallback". The probe keeps them apart for the log and for any
      # future gating, not because this condition distinguishes them.
      #
      # The fallback is keyed on the probe's answer alone. It used to carry a
      # first disjunct on the primary's outcome; that is gone because the probe now
      # always runs and always answers, so the output is the single source of
      # truth. CodeReviewConfigTest pins the whole string.
      - name: Run AI Code Review (NVIDIA NIM fallback)
        if: steps.primary_verdict.outputs.verdict != 'published'
        timeout-minutes: 15
        uses: aryanbrite/openrabbit@v0.8.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.NVIDIA_API_KEY }}
          llm_provider: groq
          llm_api_url: https://integrate.api.nvidia.com/v1
          llm_model: openai/gpt-oss-20b
          review_mode: both
          tone_mode: balanced

      # A green review check does not prove that a verdict exists. The action can
      # exit 0 having published nothing - the expected outcome on a fork pull
      # request, where the LLM secret is unavailable - or having published a
      # review whose body carries no verdict line, which is what happened on PR
      # #84. A verdict therefore means: a review by the bot on the current head
      # SHA whose body contains the "### Verdict" line. Anything else is recorded
      # on the pull request so that "no verdict" cannot pass for an approval.
      #
      # That line is a heuristic, not a contract with the action, so the step is
      # advisory: it always exits 0 (the script swallows even an unexpected
      # internal error). The required status check is where a missing verdict must
      # bite (task 5.18), and failing here would block the merge forever on a
      # wording change in a third-party action.
      #
      # Outcome dictionary (task 5.19A, documented here because GitHub does not
      # contract it): steps.<id>.outcome is one of success, failure, cancelled or
      # skipped. A per-step timeout-minutes surfaces as failure, which is why the
      # fallback above fires on 'failure' alone. The primary cannot report
      # cancelled or skipped while the job is alive, and a job that is killed
      # runs no further steps - neither `always()` nor `!cancelled()` can change
      # that, so a cancelled or timed-out run is invisible here and needs no
      # separate detector: such a run leaves the required check `OpenRabbit
      # Review` red, which is where it is handled (5.19B closed 2026-09-25
      # as obsolete with live evidence).
      #
      # By the time this runs, both providers have had their chance: it reports a
      # missing verdict only when neither the primary nor the fallback published
      # one (task 5.28 keyed the fallback on publication instead of on the exit
      # code, which is what let PR #87 merge-queue with no verdict at all).
      #
      # If both providers ran, the pull request carries two bot reviews - the
      # primary's boilerplate one and the fallback's verdict. The most recent
      # review is the authoritative one; the older boilerplate is left in place
      # rather than deleted, and this step counts the head as published when any
      # review body carries the verdict line (accepted trade-off, PRD 5.28).
      - name: Verify a verdict was published for this head
        if: always()
        # This step calls the GitHub API with retries, so like the probe step it
        # gets its own bound (task 5.29). Unlike the probe, a bound firing here
        # fails the required check within 3 minutes instead of letting the job
        # budget kill the job first: a detector that cannot verify must block
        # merges loudly rather than drop the warning silently. The step's own
        # advisory guarantee (always exit 0) is intentionally broken by the
        # bound - that is the point.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned rather than left to the script defaults: the worst-path budget
          # assertion in CodeReviewConfigTest reads these numbers.
          VERDICT_ATTEMPTS: '5'
          VERDICT_DELAY: '10'
        run: |
          bash scripts/verify-review-verdict.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.repository }}"