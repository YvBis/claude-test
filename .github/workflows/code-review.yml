name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
    contents: read
    pull-requests: write
    actions: read

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run AI Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          exclude: '*.md,*.json,package-lock.json,*.yaml,*.test.ts,migrations/*,*.spec.ts,*.e2e.ts,test/*,tests/*,workflows/*'
          model: gemini-2.5-flash-lite
          enable_conversation_context: true
          skip_draft_prs: true
          language: Russian
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  guard:
    name: Gemini Review Guard
    runs-on: ubuntu-latest
    needs: review
    if: always()
    steps:
      - name: Detect quota/model review failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          logs=$(gh run view "$GITHUB_RUN_ID" --log 2>/dev/null)
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "⚠ Cannot fetch run logs (may not be ready): $code"
            exit 0
          fi
          echo "$logs" | grep -iE "Deranked|status: 429|status: 404|Non-retryable error" > /dev/null
          if [ $? -eq 0 ]; then
            echo "::error::Gemini review hit a quota/model error (429/404/derank to retired model). Review did not run. Re-run the job when the API quota frees up."
            exit 1
          fi
          echo "OK: no quota/model errors in Gemini review run"