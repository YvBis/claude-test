name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenRabbit Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run AI Code Review (OpenRouter free)
        id: openrouter
        continue-on-error: true
        uses: aryanbrite/openrabbit@v0.8.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_provider: openrouter
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced

      - name: Run AI Code Review (NVIDIA NIM fallback)
        if: steps.openrouter.outcome == 'failure'
        uses: aryanbrite/openrabbit@v0.8.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.NVIDIA_API_KEY }}
          llm_provider: groq
          llm_api_url: https://integrate.api.nvidia.com/v1
          llm_model: openai/gpt-oss-20b
          review_mode: both
          tone_mode: balanced