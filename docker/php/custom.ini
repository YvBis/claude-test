; Custom PHP settings
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 300

; Xdebug off by default. Enable with XDEBUG_MODE=coverage when coverage is needed.
; PHP precedence: env var XDEBUG_MODE > ini xdebug.mode.
xdebug.mode = off
xdebug.start_with_request = no