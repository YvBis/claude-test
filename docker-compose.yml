services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow_app
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - /var/www/html/var
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: taskflow_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (-h 127.0.0.1), not the default socket (-h localhost, see task 8.7).
      # During the image's fresh-volume initialization MySQL runs a temporary
      # server with --skip-networking, which answers on the unix socket but has no
      # TCP listener yet; the socket form therefore reports healthy before the
      # real server exists, and `depends_on: service_healthy` starts the app too
      # early (surfaced as "SQLSTATE[HY000] [2002] Connection refused" from
      # migrations in the e2e job).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      # The TCP probe fails during MySQL's own initialization by design, so the
      # ordinary retry budget (10 x 5s) would mark the container unhealthy on a
      # cold volume and abort `up`. Failures inside start_period do not consume
      # retries and the status stays `starting`.
      start_period: 60s

  redis:
    image: redis:alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    # v1.6 (Feb 2024) is ~48 minors behind and outside upstream's security
    # window: only the latest minor receives patches. Bumped in 6.1
    # (ADR/0001-search-engine.md). Drift of this tag is tracked by review-9.
    image: getmeili/meilisearch:v1.54
    container_name: taskflow_meilisearch
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data


volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
